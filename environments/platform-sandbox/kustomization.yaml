apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./istio
  - ./cert-manager
  - ./opa
  - ./monitoring
  - ./reflector
  - ./cloudflare
  - ./flagger
  - ./kyverno
  - ./team-namespaces

labels:
  - pairs:
      env: platform-sandbox
    includeSelectors: true
    includeTemplates: true
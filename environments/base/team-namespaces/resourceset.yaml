apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: team-namespaces
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  # overlay
  inputs: []
  resources:
    # ----------------------- Namespace ------------------------
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.team >>
        labels:
          team: << inputs.team | quote >>
          environment: << inputs.environment | quote >>
          istio.io/dataplane-mode: ambient
    # ----------------------- Resource governance ------------------------
    - apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: << inputs.team >>-quota
        namespace: << inputs.team >>
      spec:
        hard:
          requests.cpu: << inputs.cpu >>
          requests.memory: << inputs.memory >>
          limits.cpu: << inputs.cpuLimit >>
          limits.memory: << inputs.memoryLimit >>
          pods: "<< inputs.maxPods >>"
    - apiVersion: v1
      kind: LimitRange
      metadata:
        name: << inputs.team >>-limits
        namespace: << inputs.team >>
      spec:
        limits:
          - type: Container
            default:
              cpu: 500m
              memory: 512Mi
            defaultRequest:
              cpu: 100m
              memory: 128Mi
    # ----------------------- RBAC ------------------------
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: << inputs.team >>-deployer
        namespace: << inputs.team >>
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: << inputs.team >>-deployer-binding
        namespace: << inputs.team >>
      subjects:
        - kind: ServiceAccount
          name: << inputs.team >>-deployer
          namespace: << inputs.team >>
      roleRef:
        kind: ClusterRole
        name: edit
        apiGroup: rbac.authorization.k8s.io
    # ----------------------- NetworkPolicy (kindnet-enforced, supported since kindnetd v1.3.0) ------------------------
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
        namespace: << inputs.team >>
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-same-namespace
        namespace: << inputs.team >>
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector: {}
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-istio-ingress
        namespace: << inputs.team >>
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: istio-system
    # ----------------------- AuthorizationPolicy (deny-by-default, explicit allows) ------------------------
    # mTLS is enforced automatically by ztunnel in ambient mode — no PeerAuthentication needed
    - apiVersion: security.istio.io/v1beta1
      kind: AuthorizationPolicy
      metadata:
        name: deny-all
        namespace: << inputs.team >>
      spec:
        rules: []
    - apiVersion: security.istio.io/v1beta1
      kind: AuthorizationPolicy
      metadata:
        name: allow-same-namespace
        namespace: << inputs.team >>
      spec:
        rules:
          - from:
              - source:
                  namespaces:
                    - << inputs.team >>
    - apiVersion: security.istio.io/v1beta1
      kind: AuthorizationPolicy
      metadata:
        name: allow-from-istio-ingress
        namespace: << inputs.team >>
      spec:
        rules:
          - from:
              - source:
                  namespaces:
                    - istio-system
                  principals:
                    - cluster.local/ns/istio-system/sa/gateway-istio

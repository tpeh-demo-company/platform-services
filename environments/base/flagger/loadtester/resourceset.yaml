apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: flagger-loadtester
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: flagger
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: flagger
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: flagger-loadtester
        namespace: flux-system
      spec:
        interval: 1h
        layerSelector:
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
          operation: copy
        ref:
          tag: << inputs.loadtesterVersion >>
        url: oci://ghcr.io/fluxcd/charts/loadtester
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: flagger-loadtester
        namespace: flux-system
      spec:
        interval: 5m
        chartRef:
          kind: OCIRepository
          name: flagger-loadtester
          namespace: flux-system
        install:
          createNamespace: false
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true

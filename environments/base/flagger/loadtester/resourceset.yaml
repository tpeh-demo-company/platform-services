apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: flagger-loadtester
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: flagger
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: flagger
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: flagger-loadtester
        namespace: flux-system
      spec:
        interval: 6h
        url: oci://ghcr.io/fluxcd/flagger-manifests
        ref:
          tag: << inputs.version >>
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flagger-loadtester
        namespace: flux-system
      spec:
        interval: 6h
        wait: true
        timeout: 5m
        prune: true
        targetNamespace: flux-system
        sourceRef:
          kind: OCIRepository
          name: flagger-loadtester
          namespace: flux-system
        path: ./tester

apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: metrics-server
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "10m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: metrics-server
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: metrics-server
        namespace: flux-system
      spec:
        interval: 30m
        url: https://kubernetes-sigs.github.io/metrics-server/
        timeout: 1m
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: metrics-server
        namespace: monitoring
      spec:
        interval: 15m
        timeout: 5m
        maxHistory: 2
        chart:
          spec:
            chart: metrics-server
            version: << inputs.version >>
            sourceRef:
              kind: HelmRepository
              name: metrics-server
              namespace: flux-system
        install:
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true
        values:
          args:
            - --kubelet-insecure-tls
          metrics:
            enabled: true
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          serviceMonitor:
            enabled: false

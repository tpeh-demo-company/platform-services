apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: tempo
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "10m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: tempo
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: tempo
        namespace: flux-system
      spec:
        interval: 5m
        layerSelector:
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
          operation: copy
        ref:
          tag: << inputs.version >>
        url: oci://ghcr.io/grafana/helm-charts/tempo
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: tempo
        namespace: monitoring
      spec:
        interval: 15m
        timeout: 5m
        maxHistory: 2
        chartRef:
          kind: OCIRepository
          name: tempo
          namespace: flux-system
        install:
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true
        values:
          tempo:
            retention: 24h

            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318
              jaeger:
                protocols: {}

            metricsGenerator:
              enabled: false

            storage:
              trace:
                backend: local
                local:
                  path: /var/tempo/traces
                wal:
                  path: /var/tempo/wal

            # Disable upstream Grafana telemetry / usage reporting.
            reportingEnabled: false

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

          persistence:
            enabled: true
            size: 10Gi
            accessModes:
              - ReadWriteOnce

          serviceMonitor:
            enabled: false

          # Tempo is internal-only — no HTTPRoute. Grafana queries via the
          # in-cluster Service.
          tempoQuery:
            enabled: false

          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
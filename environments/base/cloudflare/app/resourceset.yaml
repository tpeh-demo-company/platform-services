apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cloudflare
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: cloudflare
  resources:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: cloudflared
        namespace: cloudflare-system
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cloudflared-config
        namespace: cloudflare-system
      data:
        config.yaml: |
          tunnel: << inputs.cluster >>
          originRequest:
            noTLSVerify: true
            http2Origin: true
          ingress:
            - hostname: "*.<< inputs.cluster >>.demo-company.site"
              service: https://gateway-istio.istio-system.svc.cluster.local:443
            - service: http_status:404
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflared
        namespace: cloudflare-system
      spec:
        replicas: 2
        revisionHistoryLimit: 3
        selector:
          matchLabels:
            app: cloudflared
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
        template:
          metadata:
            labels:
              app: cloudflared
          spec:
            automountServiceAccountToken: false
            enableServiceLinks: false
            terminationGracePeriodSeconds: 30
            serviceAccountName: cloudflared
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            containers:
              - name: cloudflared
                image: mirror.gcr.io/cloudflare/cloudflared:<< inputs.version >>
                args:
                  - tunnel
                  - --config
                  - /etc/cloudflared/config/config.yaml
                  - run
                env:
                  - name: NO_AUTOUPDATE
                    value: "true"
                  - name: TUNNEL_CRED_FILE
                    value: /etc/cloudflared/creds/credentials.json
                  - name: TUNNEL_METRICS
                    value: 0.0.0.0:8080
                  - name: TUNNEL_POST_QUANTUM
                    value: "true"
                  - name: TUNNEL_TRANSPORT_PROTOCOL
                    value: quic
                startupProbe:
                  httpGet:
                    path: /ready
                    port: 8080
                    scheme: HTTP
                  failureThreshold: 30
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
                livenessProbe:
                  httpGet:
                    path: /ready
                    port: 8080
                    scheme: HTTP
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
                readinessProbe:
                  httpGet:
                    path: /ready
                    port: 8080
                    scheme: HTTP
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
                resources:
                  requests:
                    cpu: 6m
                    memory: 105Mi
                  limits:
                    memory: 105Mi
                volumeMounts:
                  - name: tunnel-config
                    mountPath: /etc/cloudflared/config/config.yaml
                    subPath: config.yaml
                    readOnly: true
                  - name: tunnel-credentials
                    mountPath: /etc/cloudflared/creds/credentials.json
                    subPath: credentials.json
                    readOnly: true
            volumes:
              - name: tunnel-config
                configMap:
                  name: cloudflared-config
              - name: tunnel-credentials
                secret:
                  secretName: cloudflare-tunnel-credentials

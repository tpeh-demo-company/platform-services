apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cloudflare
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: cloudflare
  resources:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: cloudflared
        namespace: cloudflare-system
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cloudflared-config
        namespace: cloudflare-system
      data:
        config.yaml: |
          tunnel: << inputs.cluster >>
          credentials-file: /creds/credentials.json
          originRequest:
            noTLSVerify: true
            http2Origin: true
          ingress:
            - hostname: "*.<< inputs.cluster >>.demo-company.site"
              service: https://gateway-istio.istio-system.svc.cluster.local:443
            - service: http_status:404
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflared
        namespace: cloudflare-system
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: cloudflared
        template:
          metadata:
            labels:
              app: cloudflared
          spec:
            serviceAccountName: cloudflared
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            containers:
              - name: cloudflared
                # docker rate limit
                image: mirror.gcr.io/cloudflare/cloudflared:<< inputs.version >>
                args:
                  - tunnel
                  - --config
                  - /etc/cloudflared/config.yaml
                  - run
                livenessProbe:
                  httpGet:
                    path: /ready
                    port: 2000
                  failureThreshold: 1
                  initialDelaySeconds: 10
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 100m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                volumeMounts:
                  - name: tunnel-config
                    mountPath: /etc/cloudflared
                  - name: tunnel-credentials
                    mountPath: /creds
                    readOnly: true
            volumes:
              - name: tunnel-config
                configMap:
                  name: cloudflared-config
              - name: tunnel-credentials
                secret:
                  secretName: cloudflare-tunnel-credentials

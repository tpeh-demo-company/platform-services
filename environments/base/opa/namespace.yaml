apiVersion: v1
kind: Namespace
metadata:
  name: opa-gatekeeper
  labels:
    toolkit.fluxcd.io/tenant: platform-team
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
  namespace: opa-gatekeeper
  labels:
    toolkit.fluxcd.io/tenant: platform-team
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-opa-gatekeeper
  labels:
    toolkit.fluxcd.io/tenant: platform-team
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: flux
    namespace: opa-gatekeeper

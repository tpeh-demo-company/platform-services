apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: opa
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "10m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: opa
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: gatekeeper
        namespace: flux-system
      spec:
        interval: 30m
        url: https://open-policy-agent.github.io/gatekeeper/charts
        timeout: 1m
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: gatekeeper
        namespace: opa-gatekeeper
      spec:
        interval: 5m
        chart:
          spec:
            chart: gatekeeper
            version: << inputs.version >>
            sourceRef:
              kind: HelmRepository
              name: gatekeeper
              namespace: flux-system
            interval: 10m
        install:
          createNamespace: true
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true
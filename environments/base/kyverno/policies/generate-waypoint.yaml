apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: generate-waypoint-resources
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: kyverno
      namespace: flux-system
      ready: true
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: istio-gateway
      namespace: flux-system
      ready: true
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: kube-prometheus-stack
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: policies.kyverno.io/v1
      kind: GeneratingPolicy
      metadata:
        name: generate-waypoint-resources
      spec:
        evaluation:
          synchronize:
            enabled: true
          generateExisting:
            enabled: true
        matchConstraints:
          resourceRules:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE"]
              resources: ["namespaces"]
        matchConditions:
          - expression: >
              object.metadata.?labels[?'istio.io/use-waypoint'].orValue('') == 'true'
        variables:
          - name: ns
            expression: "object.metadata.name"
          - name: gateway
            expression: >
              [{
                "kind": dyn("Gateway"),
                "apiVersion": dyn("gateway.networking.k8s.io/v1"),
                "metadata": dyn({
                  "name": "waypoint",
                  "namespace": string(variables.ns),
                  "labels": dyn({
                    "istio.io/waypoint-for": "namespace"
                  })
                }),
                "spec": dyn({
                  "gatewayClassName": "istio-waypoint",
                  "listeners": dyn([{
                    "name": "mesh",
                    "port": 15008,
                    "protocol": "HBONE"
                  }])
                })
              }]
          - name: podMonitor
            expression: >
              [{
                "kind": dyn("PodMonitor"),
                "apiVersion": dyn("monitoring.coreos.com/v1"),
                "metadata": dyn({
                  "name": "waypoint",
                  "namespace": string(variables.ns)
                }),
                "spec": dyn({
                  "selector": dyn({
                    "matchLabels": dyn({
                      "gateway.networking.k8s.io/gateway-name": "waypoint"
                    })
                  }),
                  "podMetricsEndpoints": dyn([{
                    "port": "metrics",
                    "path": "/metrics",
                    "interval": "15s"
                  }])
                })
              }]
        generate:
          - expression: "generator.Apply(variables.ns, variables.gateway)"
          - expression: "generator.Apply(variables.ns, variables.podMonitor)"

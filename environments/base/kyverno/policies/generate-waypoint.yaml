apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: generate-waypoint-resources
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "5m"
    fluxcd.controlplane.io/reconcileTimeout: "2m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: kyverno
      namespace: flux-system
      ready: true
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: istio-gateway
      namespace: flux-system
      ready: true
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: kube-prometheus-stack
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: policies.kyverno.io/v1
      kind: GeneratingPolicy
      metadata:
        name: generate-waypoint-resources
      spec:
        evaluation:
          synchronize:
            enabled: true
          generateExisting:
            enabled: true
        matchConstraints:
          resourceRules:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE"]
              resources: ["namespaces"]
        matchConditions:
          - name: has-waypoint-label
            expression: >
              object.metadata.?labels[?'istio.io/use-waypoint'].orValue('') == 'true'
        variables:
          - name: ns
            expression: "object.metadata.name"
        generate:
          - template:
              interpolate: cel
              value: |
                apiVersion: gateway.networking.k8s.io/v1
                kind: Gateway
                metadata:
                  name: waypoint
                  namespace: (( variables.ns ))
                  labels:
                    istio.io/waypoint-for: namespace
                spec:
                  gatewayClassName: istio-waypoint
                  listeners:
                    - name: mesh
                      port: 15008
                      protocol: HBONE
          - template:
              interpolate: cel
              value: |
                apiVersion: monitoring.coreos.com/v1
                kind: PodMonitor
                metadata:
                  name: waypoint
                  namespace: (( variables.ns ))
                spec:
                  selector:
                    matchLabels:
                      gateway.networking.k8s.io/gateway-name: waypoint
                  podMetricsEndpoints:
                    - port: metrics
                      path: /metrics
                      interval: 15s

apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: kyverno
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "10m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: kyverno
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kyverno
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: kyverno
        namespace: flux-system
      spec:
        interval: 1h
        layerSelector:
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
          operation: copy
        ref:
          tag: << inputs.version >>
        url: oci://ghcr.io/kyverno/charts/kyverno
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kyverno
        namespace: kyverno
      spec:
        interval: 5m
        chartRef:
          kind: OCIRepository
          name: kyverno
          namespace: flux-system
        install:
          createNamespace: false
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true
        values:
          admissionController:
            rbac:
              clusterRole:
                extraResources:
                  - apiGroups: ["gateway.networking.k8s.io"]
                    resources: ["gateways"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["monitoring.coreos.com"]
                    resources: ["podmonitors"]
                    verbs: ["get", "list", "watch"]
          backgroundController:
            rbac:
              clusterRole:
                extraResources:
                  - apiGroups: ["gateway.networking.k8s.io"]
                    resources: ["gateways"]
                    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                  - apiGroups: ["monitoring.coreos.com"]
                    resources: ["podmonitors"]
                    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
